name: Spec coverage

# Checks spec-coverage.json against the spec at its spec_tag, on every pull
# request whatever its base branch.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  spec-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: smileidentity/central-workflows/.github/actions/spec-coverage@cccc8dc1eea22671b2ad4c0ca15f03980a1879e0 # main
