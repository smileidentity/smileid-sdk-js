name: Semgrep SAST

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  security-events: write
  pull-requests: write

jobs:
  semgrep:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.157.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      # Fails the job if the scan cannot finish or finds an ERROR-severity
      # issue (CRITICAL or HIGH in newer rule sets). The SARIF file keeps
      # every finding for the uploads below.
      - name: Run Semgrep
        shell: bash
        run: |
          set -uo pipefail
          status=0
          semgrep scan --config p/security-audit \
            --sarif-output=semgrep.sarif --json-output=semgrep.json || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::Semgrep exited with status $status, so the scan did not finish."
            exit "$status"
          fi
          if ! blocking=$(python3 -c 'import json; print(sum(r["extra"].get("severity", "").upper() in {"ERROR", "CRITICAL", "HIGH"} for r in json.load(open("semgrep.json"))["results"]))'); then
            echo "::error::Could not read Semgrep's JSON output, so the findings could not be checked."
            exit 1
          fi
          if [ "$blocking" -gt 0 ]; then
            echo "::error::Semgrep found $blocking ERROR-severity finding(s). Fix them, or add a nosemgrep comment that says why the code is safe."
            exit 1
          fi
          echo "Semgrep found no ERROR-severity findings."

      # The uploads never fail the job, but they warn when they do not happen.
      - name: Upload SARIF to GitHub Security
        id: upload-sarif
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: semgrep.sarif

      - name: Warn if the SARIF upload failed
        if: always() && steps.upload-sarif.outcome == 'failure'
        run: echo "::warning::Could not upload semgrep.sarif to GitHub code scanning."

      - name: Import results into DefectDojo
        if: always()
        shell: bash
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_API_TOKEN: ${{ secrets.DEFECTDOJO_API_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
          BRANCH_TAG: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -z "$DEFECTDOJO_URL" ] || [ -z "$DEFECTDOJO_API_TOKEN" ]; then
            echo "::warning::DEFECTDOJO_URL or DEFECTDOJO_API_TOKEN is empty, so the results were not imported into DefectDojo."
            exit 0
          fi
          if [ ! -s semgrep.sarif ]; then
            echo "::warning::There is no semgrep.sarif file, so the results were not imported into DefectDojo."
            exit 0
          fi
          if ! curl -sS -f \
            -H "Authorization: Token ${DEFECTDOJO_API_TOKEN}" \
            -F "scan_type=SARIF" \
            -F "file=@semgrep.sarif" \
            -F "product_type_name=GitHub" \
            -F "product_name=${REPO_NAME}" \
            -F "engagement_name=CI" \
            -F "auto_create_context=true" \
            -F "close_old_findings=true" \
            -F "deduplication_on_engagement=true" \
            -F "commit_hash=${{ github.sha }}" \
            -F "branch_tag=${BRANCH_TAG}" \
            "${DEFECTDOJO_URL}/api/v2/reimport-scan/"; then
            echo "::warning::Could not import the results into DefectDojo."
          fi

      - name: Comment findings on PR
        if: github.event_name == 'pull_request' && always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 << 'PYEOF'
          import json, os, urllib.request

          marker = "<!-- semgrep-results -->"
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          pr = os.environ.get("PR_NUMBER", "")
          token = os.environ.get("GH_TOKEN", "")
          api = f"https://api.github.com/repos/{repo}/issues/{pr}/comments"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          findings = []
          try:
              with open("semgrep.sarif") as f:
                  sarif = json.load(f)
              for run in sarif.get("runs", []):
                  for result in run.get("results", []):
                      rule_id = result.get("ruleId", "unknown")
                      message = result.get("message", {}).get("text", "")
                      level = result.get("level", "warning")
                      for loc in result.get("locations", []):
                          phys = loc.get("physicalLocation", {})
                          path = phys.get("artifactLocation", {}).get("uri", "?")
                          line = phys.get("region", {}).get("startLine", "?")
                          findings.append({"rule": rule_id, "message": message,
                                           "level": level, "file": path, "line": line})
          except (FileNotFoundError, json.JSONDecodeError):
              pass

          if findings:
              body = f"{marker}\n## 🔍 Semgrep Security Scan Results\n\n"
              body += f"**{len(findings)} finding(s)** detected by "
              body += "[`p/security-audit`](https://semgrep.dev/p/security-audit) ruleset.\n\n"
              body += "| # | Severity | Rule | File | Line | Message |\n"
              body += "|---|----------|------|------|------|---------|\n"
              for i, f in enumerate(findings[:25], 1):
                  rule = f["rule"].split(".")[-1] if "." in f["rule"] else f["rule"]
                  msg = f["message"].replace("|", "\\|").replace("\n", " ")
                  msg = (msg[:80] + "...") if len(msg) > 80 else msg
                  body += f'| {i} | {f["level"].upper()} | `{rule}` '
                  body += f'| `{f["file"]}` | {f["line"]} | {msg} |\n'
              if len(findings) > 25:
                  body += f"\n*... and {len(findings) - 25} more. "
                  body += "See full results in workflow logs.*\n"
              body += "\n> ⚠️ ERROR-severity findings fail this check. "
              body += "Other findings are advisory: review and address them as appropriate.\n"
          else:
              body = f"{marker}\n## 🔍 Semgrep Security Scan Results\n\n"
              body += "✅ No security findings detected by "
              body += "[`p/security-audit`](https://semgrep.dev/p/security-audit) ruleset.\n"

          existing_id = None
          try:
              req = urllib.request.Request(api, headers=headers)
              resp = urllib.request.urlopen(req)
              for c in json.loads(resp.read()):
                  if marker in c.get("body", ""):
                      existing_id = c["id"]
                      break
          except Exception:
              pass

          data = json.dumps({"body": body}).encode()
          if existing_id:
              url = f"https://api.github.com/repos/{repo}/issues/comments/{existing_id}"
              req = urllib.request.Request(url, data=data, headers=headers, method="PATCH")
          else:
              req = urllib.request.Request(api, data=data, headers=headers, method="POST")

          try:
              urllib.request.urlopen(req)
              action = "Updated" if existing_id else "Posted"
              print(f"{action} comment with {len(findings)} finding(s)")
          except Exception as e:
              print(f"Warning: Could not comment on PR: {e}")
          PYEOF
