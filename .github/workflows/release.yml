name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  pull-requests: read

jobs:
  release:
    if: github.repository == 'smileidentity/smileid-sdk-js'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # The same guards run on release pull requests (quality-gates.yml), so a
      # problem shows up before the tag is pushed and the version is used up.
      - name: Verify the tag, package.json, CHANGELOG.md and breaking PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/check-release.sh "$GITHUB_REF_NAME"

      - run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Test example
        run: npm ci && npm test
        working-directory: example

      - name: Update npm for trusted publishing
        # Pinned: trusted publishing needs npm 11.5.1 or later.
        run: npm install -g npm@11.21.2

      - name: Publish to npm
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null || true)
          if [[ -n "${PUBLISHED_VERSION}" ]]; then
            echo "${PKG_NAME}@${PKG_VERSION} already exists on the registry — skipping publish."
            exit 0
          fi
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            PRERELEASE_FLAG=""
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              PRERELEASE_FLAG="--prerelease"
            fi
            gh release create "$GITHUB_REF_NAME" --generate-notes $PRERELEASE_FLAG --repo "$GITHUB_REPOSITORY"
          fi
