name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  pull-requests: read

jobs:
  release:
    if: github.repository == 'smileidentity/smileid-sdk-js'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Verify CHANGELOG.md has an entry for this version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -qF "## [${TAG_VERSION}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no ## [${TAG_VERSION}] heading for tag ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Verify the major version matches merged breaking PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -z "$PREV_TAG" ]; then
            echo "No earlier v* tag; skipping the breaking-change check."
            exit 0
          fi
          PREV_DATE="$(git for-each-ref --format='%(creatordate:iso-strict)' "refs/tags/${PREV_TAG}")"
          PREV_MAJOR="$(echo "${PREV_TAG#v}" | cut -d. -f1)"
          THIS_MAJOR="$(echo "${GITHUB_REF_NAME#v}" | cut -d. -f1)"
          BREAKING_PRS="$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged --base main --label breaking \
            --search "merged:>=${PREV_DATE}" --limit 100 --json number,title \
            --jq '.[] | "#\(.number) \(.title)"')"
          echo "Previous tag: ${PREV_TAG} (${PREV_DATE}). Breaking PRs merged since:"
          echo "${BREAKING_PRS:-  none}"
          if [ -n "$BREAKING_PRS" ] && [ "$THIS_MAJOR" -le "$PREV_MAJOR" ]; then
            echo "::error::PRs labelled 'breaking' merged since ${PREV_TAG}, so ${GITHUB_REF_NAME} must bump the major version."
            exit 1
          fi
          if [ -z "$BREAKING_PRS" ] && [ "$THIS_MAJOR" -gt "$PREV_MAJOR" ]; then
            echo "::error::${GITHUB_REF_NAME} bumps the major version, but no PR labelled 'breaking' merged since ${PREV_TAG}."
            exit 1
          fi

      - run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Test example
        run: npm ci && npm test
        working-directory: example

      - name: Update npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Publish to npm
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null || true)
          if [[ -n "${PUBLISHED_VERSION}" ]]; then
            echo "${PKG_NAME}@${PKG_VERSION} already exists on the registry — skipping publish."
            exit 0
          fi
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            PRERELEASE_FLAG=""
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              PRERELEASE_FLAG="--prerelease"
            fi
            gh release create "$GITHUB_REF_NAME" --generate-notes $PRERELEASE_FLAG --repo "$GITHUB_REPOSITORY"
          fi
