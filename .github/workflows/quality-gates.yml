name: Quality gates

on:
  pull_request:
    branches: [main]
    # labeled/unlabeled re-run the gates when `breaking` or a bot label changes.
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: quality-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BASE_REF: ${{ github.event.pull_request.base.ref }}
  # Bot PRs (spec-sync, parity-port, release, or a [bot] author) must meet the
  # changed-line coverage and no-exclusion gates; other PRs only report them.
  BOT_PR: ${{ contains(github.event.pull_request.labels.*.name, 'spec-sync') || contains(github.event.pull_request.labels.*.name, 'parity-port') || contains(github.event.pull_request.labels.*.name, 'release') || endsWith(github.event.pull_request.user.login, '[bot]') }}
  BREAKING: ${{ contains(github.event.pull_request.labels.*.name, 'breaking') }}

jobs:
  api-compat:
    name: api-compat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Compare the public API with the last release
        run: |
          # The newest stable release the base branch contains.
          TAG="$(scripts/previous-stable-tag.sh "origin/$BASE_REF")"
          if [ -z "$TAG" ]; then
            echo "::notice title=api-compat::The base branch has no vX.Y.Z release tag yet, so there is no API to compare against."
            exit 0
          fi
          echo "Comparing with $TAG"
          scripts/api-report.sh "$TAG" api-reports/release.api.md
          scripts/api-report.sh "origin/$BASE_REF" api-reports/base.api.md
          scripts/api-report.sh HEAD api-reports/head.api.md
          if node scripts/api-compat.mjs api-reports/release.api.md api-reports/head.api.md api-reports/base.api.md; then
            exit 0
          fi
          if [ "$BREAKING" = "true" ]; then
            echo "::notice title=api-compat::Breaking changes accepted because the PR has the 'breaking' label."
            exit 0
          fi
          echo "::error title=api-compat::This PR breaks the public API released in $TAG. Keep the old API, or add the 'breaking' label if the break is intended."
          exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: api-reports
          path: api-reports/
          if-no-files-found: ignore

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Test with coverage
        run: npm run coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage/cobertura-coverage.xml
            coverage/lcov.info
      - name: No coverage exclusions added
        run: |
          if ! scripts/check-coverage-exclusions.sh "origin/$BASE_REF"; then
            if [ "$BOT_PR" = "true" ]; then exit 1; fi
            echo "::warning title=coverage::This PR adds coverage exclusions. Bot PRs would fail here."
          fi
      - name: Changed lines are covered
        run: |
          if ! pipx run --spec diff-cover==10.6.0 diff-cover coverage/cobertura-coverage.xml \
              --compare-branch="origin/$BASE_REF" --fail-under=100; then
            if [ "$BOT_PR" = "true" ]; then exit 1; fi
            echo "::warning title=coverage::Changed lines are not fully covered. Bot PRs would fail here."
          fi
      - name: generated/ has 100% line and branch coverage
        run: npm run coverage:generated

  scripts:
    name: scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: '.nvmrc'
      # Pinned, so a new runner image cannot bring a ShellCheck with new rules.
      - name: Install ShellCheck
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          archive="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${archive}"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}" >>"$GITHUB_PATH"
      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck scripts/*.sh
      - name: Test scripts/bump-version.sh
        run: scripts/test-bump-version.sh
      - name: Test scripts/check-coverage-exclusions.sh
        run: scripts/test-check-coverage-exclusions.sh
      - name: Test the release tag and breaking-PR checks
        run: scripts/test-release-check.sh
      - name: Test scripts/api-compat.mjs
        run: node --test scripts/*.test.mjs

  # The guards release.yml runs on the tag, run here first. Tags cannot be
  # moved, so a guard that fails after the tag is pushed uses up the version.
  release-guards:
    name: release-guards
    if: contains(github.event.pull_request.labels.*.name, 'release') || startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Release tags, for the previous release and the breaking-PR range.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: '.nvmrc'
      - name: Run the release guards on this pull request
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          # The version comes from a release/vX.Y.Z branch, or else package.json.
          if [[ "$HEAD_REF" == release/v* ]]; then
            tag="${HEAD_REF#release/}"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          echo "Checking the release of $tag"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists. Bump the version with scripts/bump-version.sh."
            exit 1
          fi
          scripts/check-release.sh "$tag" HEAD
